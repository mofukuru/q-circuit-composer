version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      # One PR per week for all minor and patch updates; majors come separately.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, 'area: ci']

  - package-ecosystem: pip
    directory: /tools/reference
    schedule:
      interval: monthly
    labels: [dependencies]
